<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook – v2</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #172033; }
    h1 { color: #2457a7; }
    form { display: flex; gap: .5rem; margin: 1rem 0; }
    input { flex: 1; padding: .75rem; border: 1px solid #bbc5d5; border-radius: .5rem; }
    button { padding: .75rem 1rem; border: 0; border-radius: .5rem; background: #2457a7; color: white; cursor: pointer; }
    li { padding: .5rem 0; border-bottom: 1px solid #e4e8ef; }
    .note { color: #596579; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Guestbook – v2</h1>
  <p>Welcome to version 2 of the guestbook. Leave a message below.</p>
  <form id="guestbook-form">
    <input id="message" aria-label="Your message" placeholder="Write a message..." maxlength="200" required>
    <button type="submit">Submit</button>
  </form>
  <ul id="messages"></ul>
  <p class="note">Starter demo v2: messages are kept in this browser only.</p>
  <script>
    const form = document.getElementById('guestbook-form');
    const input = document.getElementById('message');
    const list = document.getElementById('messages');
    const saved = JSON.parse(localStorage.getItem('guestbook-messages') || '[]');
    function render() {
      list.replaceChildren();
      saved.forEach((message) => {
        const item = document.createElement('li');
        item.textContent = message;
        list.appendChild(item);
      });
    }
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      saved.unshift(value);
      localStorage.setItem('guestbook-messages', JSON.stringify(saved.slice(0, 50)));
      input.value = '';
      render();
    });
    render();
  </script>
</body>
</html>
